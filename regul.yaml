
alias: Regulation solaire optimisée
description: >-
  Régulation progressive Izypower Titan selon la puissance réseau du Shelly.
  Puissance positive = consommation réseau.
  Puissance négative = surplus solaire.
triggers:
  - trigger: state
    entity_id: sensor.shelly_les_essarts_power
    id: mesure

  - trigger: time_pattern
    seconds: "/10"
    id: regulation

  - trigger: state
    entity_id:
      - input_select.action_batterie
      - input_boolean.izypower_actif
    id: mode

  - trigger: state
    entity_id:
      - sensor.izypower_titan_titan_battery
      - sensor.panneaux_solaire_total_ac_output_power_active
    id: conditions

  - trigger: time
    at: "23:00:00"
    id: nuit

conditions:
  - condition: state
    entity_id: input_boolean.izypower_actif
    state: "on"

  - condition: template
    value_template: >-
      {{ is_number(states('sensor.shelly_les_essarts_power'))
         and is_number(states('number.izypower_titan_charge_discharge_power')) }}

actions:
  - variables:
      # Mesure réseau : positif = importation, négatif = injection
      reseau: "{{ states('sensor.shelly_les_essarts_power') | float }}"

      # Dernière consigne connue
      commande: >-
        {{ states('number.izypower_titan_charge_discharge_power') | float }}
      
      # Niveau de batterie
      soc: "{{ states('sensor.izypower_titan_titan_battery') | float(0) }}"

      # Puissance des panneaux solaire
      solaire: >-
        {{ states('sensor.panneaux_solaire_total_ac_output_power_active')
           | float(0) }}
      
      # Selecteur de mode
      mode_batterie: "{{ states('input_select.action_batterie') }}"

      # Réglages
      cible: 30
      zone_morte: 40
      rampe: 50
      pas: 10
      max_charge: 2400
      max_decharge: 500
      max_nuit: 200

      # Erreur de régulation avec zone morte
      erreur: >-
        {% set e = (reseau | float) - cible %}
        {{ 0 if (e | abs) <= zone_morte else e }}

      # Correction limitée à RAMPE W par cycle
      variation: >-
        {% set e = erreur | float %}
        {% set v = [[-rampe, e] | max, rampe] | min %}
        {{ ((v / pas) | round(0) * pas) | int }}

      # Charge : injection -> augmenter la consigne
      consigne_charge: >-
        {% set v = (commande | float) - (variation | float) %}
        {{ [[0, v] | max, max_charge] | min | int }}

      # Décharge : consommation -> augmenter la consigne
      consigne_decharge: >-
        {% set v = (commande | float) + (variation | float) %}
        {{ [[0, v] | max, max_decharge] | min | int }}

      # Décharge nocturne plafonnée à MAX_NUIT W
      consigne_nuit: >-
        {% set v = (commande | float) + (variation | float) %}
        {{ [[0, v] | max, max_nuit] | min | int }}

  - choose:
      # ===================== CHARGE =====================
      - conditions:
          - condition: state
            entity_id: input_select.action_batterie
            state: "Charge"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ states('number.izypower_titan_max_charge_power')
                     | float(-1) != max_charge }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.izypower_titan_max_charge_power
                data:
                  value: "{{ max_charge }}"

          - if:
              - condition: template
                value_template: >-
                  {{ (consigne_charge | int - commande | float) | abs >= pas }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.izypower_titan_charge_discharge_power
                data:
                  value: "{{ consigne_charge }}"

              - action: button.press
                target:
                  entity_id: button.izypower_titan_start_charge

      # ===================== DÉCHARGE =====================
      - conditions:
          - condition: state
            entity_id: input_select.action_batterie
            state: "Decharge"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ states('number.izypower_titan_max_discharge_power')
                     | float(-1) != max_decharge }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.izypower_titan_max_discharge_power
                data:
                  value: "{{ max_decharge }}"

          - if:
              - condition: template
                value_template: >-
                  {{ (consigne_decharge | int - commande | float) | abs >= pas }}
            then:
              - action: number.set_value
                target:
                  entity_id: number.izypower_titan_charge_discharge_power
                data:
                  value: "{{ consigne_decharge -30 }}"

              - action: button.press
                target:
                  entity_id: button.izypower_titan_start_discharge

      # ===================== AUTO =====================
      - conditions:
          - condition: state
            entity_id: input_select.action_batterie
            state: "Auto"
        sequence:
          - choose:

              # Après 23 h : décharge uniquement si SOC > 70 %
              - conditions:
                  - condition: time
                    after: "23:00:00"
                  - condition: numeric_state
                    entity_id: sensor.izypower_titan_titan_battery
                    above: 70
                sequence:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states('number.izypower_titan_max_discharge_power')
                             | float(-1) != max_nuit }}
                    then:
                      - action: number.set_value
                        target:
                          entity_id: number.izypower_titan_max_discharge_power
                        data:
                          value: "{{ max_nuit }}"

                  - if:
                      - condition: template
                        value_template: >-
                          {{ (consigne_nuit | int - commande | float) | abs >= pas }}
                    then:
                      - action: number.set_value
                        target:
                          entity_id: number.izypower_titan_charge_discharge_power
                        data:
                          value: "{{ consigne_nuit -30 }}"

                      - action: button.press
                        target:
                          entity_id: button.izypower_titan_start_discharge

              # Après 23 h : SOC insuffisant, arrêt de la décharge
              - conditions:
                  - condition: time
                    after: "23:00:00"
                  - condition: numeric_state
                    entity_id: sensor.izypower_titan_titan_battery
                    below: 20
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ commande | float > 0 }}"
                    then:
                      - action: number.set_value
                        target:
                          entity_id: number.izypower_titan_charge_discharge_power
                        data:
                          value: 0

                      - action: button.press
                        target:
                          entity_id: button.izypower_titan_standby

              # Avant 23 h : régulation de charge
              - conditions:
                  - condition: time
                    before: "23:00:00"
                sequence:
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states('number.izypower_titan_max_charge_power')
                             | float(-1) != max_charge }}
                    then:
                      - action: number.set_value
                        target:
                          entity_id: number.izypower_titan_max_charge_power
                        data:
                          value: "{{ max_charge }}"

                  - if:
                      - condition: template
                        value_template: >-
                          {{ (consigne_charge | int - commande | float) | abs >= pas }}
                    then:
                      - action: number.set_value
                        target:
                          entity_id: number.izypower_titan_charge_discharge_power
                        data:
                          value: "{{ consigne_charge }}"

                      - action: button.press
                        target:
                          entity_id: button.izypower_titan_start_charge

mode: single
max_exceeded: silent
